name: mappo

# ppo
train_every: 64
num_minibatches: 16
ppo_epochs: 4
use_TP_net: 1
TP_epochs: 1
clip_param: 0.02
entropy_coef: 0.0
entropy_schedule:
  enabled: true
  hold_coef: 0.0
  release_coef: 0.001
  success_threshold: 0.60
  success_target: 0.80
  ema_alpha: 0.05
  min_env_frames: 5000000
gae_lambda: 0.95
gamma: 0.995
max_grad_norm: 10.0
normalize_advantages: True

warmstart:
  actor_freeze:
    enabled: true
    frames: 5000000
  actor_lr_warmup:
    enabled: true
    frames: 100000000
    lr_init: 0.000004
    lr_final: ${algo.actor.lr}
  critic_lr_warmup:
    enabled: false
    frames: 0
    lr_init: ${algo.critic.lr}
    lr_final: ${algo.critic.lr}
  actor_log_std_schedule:
    enabled: true
    reset_on_curriculum_stage: true
    adaptive_release:
      enabled: true
      min_frames: 100000000
      success_threshold: 0.70
      mse_threshold: 0.01
      consecutive_evals: 1
      step_frames: 20000000
      init_std: 0.01
      std_increment: 0.01
      max_std: 0.05
    frames:
      - 0
      - 100000000
      - 120000000
      - 140000000
      - 160000000
      - 180000000
    values:
      - -4.605170
      - -4.605170
      - -4.199705
      - -3.912023
      - -3.688879
      - -2.995732
  kl_reg:
    enabled: true
    target_kl: 0.03
    coef: 0.0
    hard_stop: true
  anchor:
    enabled: false
    coef_init: 0.0
    coef_final: 0.0
    decay_frames: 0
    loss_type: mse
  expert_kl:
    enabled: true
    coef_init: 1.0
    coef_final: 1.0
    decay_frames: 0
    reset_on_curriculum_stage: true
    decay_after_eval_success:
      enabled: true
      success_threshold: 0.60
      consecutive_evals: 3
      min_frames: 5000000
    loss_type: mse
    fixed_std: 0.01
    mse_boost_enabled: true
    mse_boost_threshold: 0.02
    mse_boost_coef: 2.0
    mse_boost_ema_beta: 0.95
    max_loss: null
    pred_mode: oracle_pos
    strategy_variant: expert2
    forward_dir_mode: default
    enable_goal_mode: false
    enable_close_mode: true
    enable_rush_mode: false
    expert2_front_layout: symmetric

reward_weights: null # null means all 1.0
share_actor: True
critic_input: state # `obs` or `state`

actor:
  lr: 0.000004
  lr_scheduler: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  lr_scheduler_kwargs:
    T_0: 2000
    T_mult: 2
    eta_min: 0.0000005
  
  # mlp
  hidden_units: [256, 256, 256]
  layer_norm: true

  weight_decay: 0.0
  gain: 0.01

  vision_encoder: MobileNetV3Small
  attn_encoder: CoopEntityAttentionEncoder # self token + teammate entities + local cylinders
  use_orthogonal: true

  tanh: true
  log_std_init: -4.605170
  log_std_min: -4.605170
  log_std_max: -1.0
  bc_aux:
    enabled: false
    hidden_dim: 256
    condition_action_on_aux: true
    condition_hidden_dim: 256

  # rnn:
  #   cls: gru
  #   kwargs:
  #     hidden_size: 128
  #   train_seq_len: 16

critic:
  num_critics: 1
  value_norm:
    class: ValueNorm1
    kwargs: 
      beta: 0.995

  lr: 0.0005
  lr_scheduler: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  lr_scheduler_kwargs:
    T_0: 1000
    T_mult: 2
    eta_min: 0.00005

  # mlp
  hidden_units: [256, 256, 256]
  layer_norm: true

  weight_decay: 0.0
  gain: 0.01

  use_huber_loss: true
  huber_delta: 10

  # rnn:
  #   cls: gru
  #   kwargs:
  #     hidden_size: 128
  #   train_seq_len: 16

  vision_encoder: MobileNetV3Small
  attn_encoder: RelationEncoder # CTDE critic over global drone + obstacle entities
  use_feature_normalization: true
  use_orthogonal: true
